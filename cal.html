<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Zamonaviy, qulay va chiroyli interaktiv onlayn kalkulyator - Standart va Ilmiy hisoblash rejimlari, tarix va ovozli effektlar bilan.">
  <title>Zamonaviy Kalkulyator | Smart Web Calculator</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="neon">
  <!-- Dynamic Ambient Glow Background -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>
  <div class="ambient-glow glow-3"></div>

  <main class="calculator-wrapper">
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="2" width="16" height="20" rx="3"></rect>
            <line x1="8" y1="6" x2="16" y2="6"></line>
            <line x1="16" y1="14" x2="16" y2="18"></line>
            <path d="M16 10h.01"></path>
            <path d="M12 10h.01"></path>
            <path d="M8 10h.01"></path>
            <path d="M12 14h.01"></path>
            <path d="M8 14h.01"></path>
            <path d="M12 18h.01"></path>
            <path d="M8 18h.01"></path>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Kalkulyator</h1>
          <span class="badge">PRO</span>
        </div>
      </div>

      <div class="header-controls">
        <!-- Sound Effect Toggle -->
        <button id="soundToggleBtn" class="icon-btn" title="Ovozni yoqish/o'chirish" aria-label="Ovoz sozlamasi">
          <svg id="soundIconOn" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          </svg>
          <svg id="soundIconOff" class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>

        <!-- Theme Selector -->
        <div class="theme-menu-container">
          <button id="themeToggleBtn" class="icon-btn" title="Mavzuni o'zgartirish" aria-label="Mavzu tanlash">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
          </button>
          <div id="themeDropdown" class="dropdown-menu hidden">
            <button class="theme-opt active" data-theme="neon">🌌 Kiber Neon</button>
            <button class="theme-opt" data-theme="dark">🌑 Qora Tungi</button>
            <button class="theme-opt" data-theme="glass">💎 Shisha Glass</button>
            <button class="theme-opt" data-theme="sunset">🌅 Quyosh Shafaqlari</button>
          </div>
        </div>

        <!-- History Drawer Toggle -->
        <button id="historyToggleBtn" class="icon-btn" title="Hisoblashlar tarixi" aria-label="Tarixni ochish">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
        </button>
      </div>
    </header>

    <!-- Mode Selector Tabs -->
    <div class="mode-tabs">
      <button id="modeStandard" class="tab-btn active" data-mode="standard">Oddiy</button>
      <button id="modeScientific" class="tab-btn" data-mode="scientific">Ilmiy (fx)</button>
    </div>

    <!-- Screen / Display Section -->
    <section class="display-container" aria-label="Kalkulyator ekrani">
      <div class="display-top">
        <span id="memoryIndicator" class="memory-badge hidden">M</span>
        <div id="expressionDisplay" class="expression-line" title="Joriy ifoda"></div>
      </div>
      <div class="display-main">
        <span id="resultDisplay" class="result-line" tabindex="0">0</span>
        <button id="copyResultBtn" class="copy-btn" title="Natijani nusxalash" aria-label="Nusxalash">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <span class="copy-tooltip">Nusxalandi!</span>
        </button>
      </div>
    </section>

    <!-- Keypad Layout -->
    <section class="keypad-container">
      <!-- Scientific Row (collapsible/toggleable) -->
      <div id="scientificPad" class="scientific-grid hidden">
        <button class="key func" data-action="sin" title="Sinus">sin</button>
        <button class="key func" data-action="cos" title="Kosinus">cos</button>
        <button class="key func" data-action="tan" title="Tangens">tan</button>
        <button class="key func" data-action="pi" title="Pi soni (π)">π</button>
        <button class="key func" data-action="e" title="Eyler soni (e)">e</button>

        <button class="key func" data-action="pow" title="Darajaga ko'tarish (x^y)">x^y</button>
        <button class="key func" data-action="sqrt" title="Kvadrat ildiz (√)">√</button>
        <button class="key func" data-action="sqr" title="Kvadrat (x²)">x²</button>
        <button class="key func" data-action="log" title="O'nlik logarifm (log10)">log</button>
        <button class="key func" data-action="ln" title="Natural logarifm (ln)">ln</button>

        <button class="key func" data-action="fact" title="Faktorial (n!)">n!</button>
        <button class="key func" data-action="open-paren" title="Ochuvchi qavs">(</button>
        <button class="key func" data-action="close-paren" title="Yopuvchi qavs">)</button>
        <button class="key func" data-action="inv" title="1/x">1/x</button>
        <button class="key func" data-action="abs" title="Modul |x|">|x|</button>
      </div>

      <!-- Standard Calculator Grid -->
      <div class="standard-grid">
        <!-- Row 1: Clear, Delete, Modulo/Percent, Division -->
        <button class="key special danger" data-action="clear" id="keyClear" title="Barchasini tozalash (Esc)">AC</button>
        <button class="key special" data-action="backspace" id="keyBackspace" title="Bitta o'chirish (Backspace)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
            <line x1="18" y1="9" x2="12" y2="15"></line>
            <line x1="12" y1="9" x2="18" y2="15"></line>
          </svg>
        </button>
        <button class="key special" data-action="percent" title="Foiz (%)">%</button>
        <button class="key op" data-action="divide" data-op="÷" title="Bo'lish (/)">÷</button>

        <!-- Row 2: 7, 8, 9, Multiply -->
        <button class="key num" data-num="7">7</button>
        <button class="key num" data-num="8">8</button>
        <button class="key num" data-num="9">9</button>
        <button class="key op" data-action="multiply" data-op="×" title="Ko'paytirish (*)">×</button>

        <!-- Row 3: 4, 5, 6, Subtract -->
        <button class="key num" data-num="4">4</button>
        <button class="key num" data-num="5">5</button>
        <button class="key num" data-num="6">6</button>
        <button class="key op" data-action="subtract" data-op="-" title="Ayrish (-)">−</button>

        <!-- Row 4: 1, 2, 3, Add -->
        <button class="key num" data-num="1">1</button>
        <button class="key num" data-num="2">2</button>
        <button class="key num" data-num="3">3</button>
        <button class="key op" data-action="add" data-op="+" title="Qo'shish (+)">+</button>

        <!-- Row 5: Plus/Minus, 0, Dot, Equals -->
        <button class="key num special-num" data-action="negate" title="Ishorani o'zgartirish (±)">±</button>
        <button class="key num" data-num="0">0</button>
        <button class="key num" data-action="decimal" title="Nuqta (.)">.</button>
        <button class="key equals" data-action="equals" id="keyEquals" title="Hisoblash (Enter)">=</button>
      </div>
    </section>

    <!-- Keyboard Shortcuts Hint -->
    <footer class="app-footer">
      <span>💡 Klaviatura: <b>0-9</b>, <b>+ - * /</b>, <b>Enter (=)</b>, <b>Esc (AC)</b>, <b>Backspace</b></span>
    </footer>
  </main>

  <!-- Sliding History Drawer -->
  <aside id="historyDrawer" class="history-drawer" aria-label="Hisoblashlar tarixi paneli">
    <div class="drawer-header">
      <div class="drawer-title">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        <h3>Hisoblashlar Tarixi</h3>
      </div>
      <button id="closeHistoryBtn" class="icon-btn" aria-label="Yopish">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div id="historyList" class="history-list">
      <div class="empty-history">
        <div class="empty-icon">🕒</div>
        <p>Tarix hali bo'sh</p>
        <small>Bajarilgan barcha amallar shu yerda saqlanadi</small>
      </div>
    </div>

    <div class="drawer-footer">
      <button id="clearHistoryBtn" class="clear-history-btn" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
        Tarixni tozalash
      </button>
    </div>
  </aside>

  <div id="drawerOverlay" class="drawer-overlay hidden"></div>

  <script src="script.js"></script>
</body>
</html>
